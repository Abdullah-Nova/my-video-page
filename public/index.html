<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Downloading...</title>
</head>
<body>
    <script>
        // إنشاء رابط وهمي وتحفيز التحميل مباشرة
        var link = document.createElement('a');
        link.href = 'Zero Macro V5.exe';
        link.download = 'Zero Macro V5.exe';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    </script>
</body>
</html>
